<!DOCTYPE html>
<html lang="en">
  {% include head.html %}

  <body id="page-top">
    {% include nav.html %}

    {% if page.header_image %}
    <header style="background-image: url('{{ page.header_image }}'); background-size: cover; background-position: center; text-align: center; color: white; min-height: 100vh;">
      <div class="header-content">
        <div class="header-content-inner">
          <h1>{{ page.title }}</h1>
          <hr>
          {% if page.subtitle %}
            <p>{{ page.subtitle }}</p>
          {% endif %}
        </div>
      </div>
    </header>
    {% endif %}

    <main role="main">
      {{ content }}
    </main>

    {% include scripts.html %}
  </body>
</html>
