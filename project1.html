  function groupDates(rows, mode){
    function key(d){
      const dt=new Date(d);
      if(mode==="month") return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`;
      if(mode==="week"){
        const tmp=new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));

    return { keys, revenue: keys.map(k=>m.get(k).rev), qty: keys.map(k=>m.get(k).qty), profit: keys.map(k=>m.get(k).prof) };
